<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudyFlow — Privasi &amp; Akun</title>
  <style>
    :root { --navy:#0F2A47; --accent:#3B82F6; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0F2A47 0%, #1d4ed8 100%);
      min-height: 100vh;
      display: grid; place-items: center;
      color: #fff;
      padding: 24px;
    }
    .card {
      background: #fff;
      color: #1f2937;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }
    .logo { font-size: 30px; font-weight: 800; color: var(--navy); }
    .logo span { color: var(--accent); }
    .sub { color: #6b7280; margin: 8px 0 28px; font-size: 14px; }
    a.btn {
      display: block;
      background: var(--accent);
      color: #fff !important;
      text-decoration: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      margin: 10px 0;
    }
    a.btn.outline {
      background: transparent;
      color: var(--accent) !important;
      border: 2px solid var(--accent);
    }
    .muted { color: #9ca3af; font-size: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Study<span>Flow</span></div>
    <p class="sub">Aplikasi manajemen belajar untuk pelajar Indonesia</p>
    <a class="btn" href="privacy-policy.html">Kebijakan Privasi</a>
    <a class="btn outline" href="account-deletion.html">Hapus Akun &amp; Data</a>
    <p class="muted">© 2026 StudyFlow</p>
  </div>
</body>
</html>
