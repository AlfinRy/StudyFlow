<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudyFlow — Privasi &amp; Akun</title>
  <meta name="theme-color" content="#0F2A47" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0F2A47; --navy-2: #16324F; --accent: #3B82F6;
      --ink: #0F172A; --muted: #64748B;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Lexend", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(120% 100% at 80% 0%, #16324F 0%, var(--navy) 60%);
      color: #fff; display: grid; place-items: center; padding: 28px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; max-width: 420px; text-align: center;
      background: #fff; color: var(--ink);
      border-radius: 22px; padding: 44px 34px;
      box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5);
    }
    .brand { display: inline-flex; align-items: center; gap: 12px; font-size: 32px; font-weight: 800; letter-spacing: -0.03em; color: var(--navy); }
    .brand .logo { width: 48px; height: 48px; }
    .brand b { color: var(--accent); }
    .sub { color: var(--muted); margin: 12px 0 30px; font-size: 0.98rem; line-height: 1.6; }
    .btn {
      display: block; text-decoration: none; font-weight: 700; font-size: 1rem;
      padding: 15px; border-radius: 12px; margin: 11px 0;
      transition: transform .22s cubic-bezier(.2,.7,.2,1), background .2s, box-shadow .2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn.primary { background: var(--navy); color: #fff; box-shadow: 0 12px 24px -12px rgba(15,42,71,0.7); }
    .btn.primary:hover { background: #14375a; }
    .btn.ghost { background: transparent; color: var(--navy); border: 1.5px solid var(--navy); }
    .btn.ghost:hover { background: #F7F9FC; }
    .muted { color: #94a3b8; font-size: 0.78rem; margin-top: 26px; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    .card { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><img class="logo" src="logo-studyflow.png" alt="Logo StudyFlow" /><span>Study<b>Flow</b></span></div>
    <p class="sub">Aplikasi manajemen belajar untuk pelajar Indonesia.<br/>Privasi &amp; akun Anda.</p>
    <a class="btn primary" href="privacy-policy.html">Kebijakan Privasi</a>
    <a class="btn ghost" href="account-deletion.html">Hapus Akun &amp; Data</a>
    <div class="muted">© 2026 StudyFlow</div>
  </div>
</body>
</html>
